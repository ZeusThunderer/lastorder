[project]
name = "last-order"
version = "0.1.0"
description = "Last Order: a network of Minecraft nodes with a shared memory"
requires-python = ">=3.12,<3.13"
dependencies = [
    "litellm>=1.50",
    "py4j>=0.10.9.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
hive = ["fastapi>=0.115", "uvicorn>=0.30"]

[dependency-groups]
# The hive extra rides along in dev so plain `uv run pytest` covers the API tests too
# (tests/test_hive_*.py); the image installs it explicitly (docker/mind/Dockerfile).
dev = ["pytest>=8", "last-order[hive]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
