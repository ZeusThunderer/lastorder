# LiteLLM proxy config of the llm-gateway service (T-026, ADR-033). The gateway is the only
# path to cloud models: provider keys live in its environment, consumers (node sandboxes, the
# hive with Last Order, the minds) get the gateway address plus their own virtual key issued by
# dev/gateway_keys.py. The proxy port stays inside the docker network.
#
# ADR-023 tiers become gateway settings here. `model_name` is the full litellm model string —
# the same value consumers already keep in LLM_<TIER>_MODEL, so runtime/llm/client.py needs no
# model rewriting when LLM_API_BASE points at the gateway. GLM Coding Plan is NOT routed here:
# Z.ai usage policy allows only supported tools (T-024, docs/agents/harness-spike.md step 0),
# the subscription token stays in node-N (ADR-033).

model_list:
  # Each tier is listed twice: under the full litellm name and under the bare provider id.
  # The litellm SDK strips the provider prefix when a custom api_base is set (verified live:
  # a node's client sends model=qwen/qwen3.7-flash to the gateway), while OpenAI-style
  # callers use the full string — the gateway answers to both with the same deployment.
  #
  # tier `node`: the step model of a node harness
  - model_name: openrouter/qwen/qwen3.7-flash
    litellm_params:
      model: openrouter/qwen/qwen3.7-flash
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: qwen/qwen3.7-flash
    litellm_params:
      model: openrouter/qwen/qwen3.7-flash
      api_key: os.environ/OPENROUTER_API_KEY
  # tier `smart`: Last Order, wills and network consolidation
  - model_name: openrouter/z-ai/glm-5.3-flash
    litellm_params:
      model: openrouter/z-ai/glm-5.3-flash
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: z-ai/glm-5.3-flash
    litellm_params:
      model: openrouter/z-ai/glm-5.3-flash
      api_key: os.environ/OPENROUTER_API_KEY
  # tier `jev`: the cloud tactical decider of C1 (T-031, ADR-027). typesafe/jev-router is the
  # current OpenRouter id of the System One Jev model (was typesafe/jev-1.13 in ADR-004).
  # C1 waits for no one: per-deployment `timeout` and `num_retries: 0` override the global
  # num_retries (verified in the running image, litellm 1.106.0: Router.
  # _set_deployment_num_retries_on_exception reads litellm_params.num_retries), so a timed-out
  # Jev call is not retried by the proxy after C1 already fell back to the rules (plan review
  # P1-2); `max_retries: 0` disables the SDK's own client retries (default 2) for the same
  # reason. The timeout value follows the T-031 probe p95, see docs/agents/jev.md.
  - model_name: openrouter/typesafe/jev-router
    litellm_params:
      model: openrouter/typesafe/jev-router
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 10
      num_retries: 0
      max_retries: 0
  - model_name: typesafe/jev-router
    litellm_params:
      model: openrouter/typesafe/jev-router
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 10
      num_retries: 0
      max_retries: 0

litellm_settings:
  # consumers send tier-specific extras (reasoning off); anything the provider does not know
  # is dropped instead of failing the call
  drop_params: true
  num_retries: 2
  request_timeout: 120

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
