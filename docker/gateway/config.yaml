router_settings:
  # Go first, then OpenRouter on errors/quota; Jev keeps its independent local fallback.
  fallbacks:
    - {"openrouter/z-ai/glm-5.3-flash": ["openrouter-reserve/smart"]}
    - {"z-ai/glm-5.3-flash": ["openrouter-reserve/smart"]}
    - {"openrouter/qwen/qwen3.7-flash": ["openrouter-reserve/node"]}
    - {"qwen/qwen3.7-flash": ["openrouter-reserve/node"]}
    - {"opencode-go/glm-5.3-flash": ["openrouter-reserve/smart"]}

litellm_settings:
  # consumers send tier-specific extras (reasoning off); anything the provider does not know
  # is dropped instead of failing the call
  drop_params: true
  num_retries: 2
  request_timeout: 120

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
