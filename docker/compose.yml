# Last Order MVP stack (ADR-015). Run from the repo root:
#   docker compose -f docker/compose.yml up -d --build
# Slots are body-N + mind-N pairs; the mind lives in its body's network namespace because the
# unionclef py4j gateway listens on localhost only.
name: lastorder

x-body: &body
  build: ./body
  image: lastorder-body:dev
  restart: unless-stopped
  depends_on:
    mc-server:
      condition: service_healthy
  mem_limit: 2g
  environment: &body-env
    BODY_XMX: "${BODY_XMX:-768M}"   # same default as the body Dockerfile ENV (review R1-2)
    BODY_RENDER_DISTANCE: "${BODY_RENDER_DISTANCE:-2}"
    BODY_SIM_DISTANCE: "${BODY_SIM_DISTANCE:-5}"   # vanilla client minimum; lower falls back to 12
    BODY_MAX_FPS: "${BODY_MAX_FPS:-10}"
    MALLOC_ARENA_MAX: "2"   # glibc arenas: 8 per thread by default, 2 is plenty for a JVM body

services:
  mc-server:
    image: itzg/minecraft-server:java21
    environment:
      EULA: "TRUE"
      TYPE: "VANILLA"
      VERSION: "1.21.11"
      ONLINE_MODE: "FALSE"
      ENFORCE_SECURE_PROFILE: "FALSE"   # offline clients cannot sign chat
      DIFFICULTY: "easy"
      MODE: "survival"
      MEMORY: "1536M"
      VIEW_DISTANCE: "6"
      SIMULATION_DISTANCE: "5"
      SPAWN_PROTECTION: "0"
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: "${RCON_PASSWORD:-lastorder}"
      MOTD: "Last Order"
    ports:
      - "${MC_HOST_PORT:-25565}:25565"   # join from the host to watch
    volumes:
      - world:/data
    restart: unless-stopped

  body-1:
    <<: *body
    environment:
      <<: *body-env
      MC_USERNAME: LastOrder01
      MC_SERVER: mc-server:25565
    volumes:
      - body-1:/data

  mind-1:
    build:
      context: ..
      dockerfile: docker/mind/Dockerfile
    image: lastorder-mind:dev
    network_mode: "service:body-1"
    depends_on: [body-1]
    environment:
      MC_USERNAME: LastOrder01
      RCON_HOST: mc-server
      RCON_PASSWORD: "${RCON_PASSWORD:-lastorder}"
    command: ["python", "tools/body_probe.py", "--kill"]
    restart: "no"

  # The hive (NETWORK.md section 3): node registry, knowledge base under git (T-012 store),
  # the lifetime scan and RCON deaths (T-022). Port 8000 stays inside the docker network —
  # minds reach it as `hive:8000`; nothing is published to the host. Exactly one uvicorn
  # worker: lifecycle.json, the inboxes and the slot sequence are in-process state under
  # locks, a second worker would race them (T-022 review P1-4).
  hive:
    build:
      context: ..
      dockerfile: docker/mind/Dockerfile
    image: lastorder-mind:dev
    depends_on:
      mc-server:
        condition: service_healthy
    environment:
      KNOWLEDGE_DIR: /knowledge
      RUN_DIR: /hive-run
      RCON_HOST: mc-server
      RCON_PASSWORD: "${RCON_PASSWORD:-lastorder}"
      MAX_LIFE_MIN: "${MAX_LIFE_MIN:-45}"
    command:
      - uvicorn
      - runtime.hive.app:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
    volumes:
      - knowledge:/knowledge
      - hive-run:/hive-run   # not over the image's system /run (review R1-6)
    restart: unless-stopped

  # FastJev decision server for C1 (T-005, ADR-004/023). Raises only under --profile jev.
  # GPU 0 is the RTX 2070 (5070 Ti stays free); model checkpoints live in the named volume,
  # never a bind mount. The 127.0.0.1 publish exists only for the dev/jev_spike.py measurement;
  # production callers reach the service inside the docker network as `jev:8000`.
  jev:
    build: ./jev
    image: lastorder-jev:dev
    profiles: ["jev"]
    environment:
      HF_HOME: /data/hf
    command:
      - --host
      - 0.0.0.0
      - --allow-unauthenticated
      - --model
      - ${JEV_MODEL:-Qwen/Qwen3-0.6B}
      - --revision
      - ${JEV_REVISION:-c1899de289a04d12100db370d81485cdf75e47ca}
      - --served-model
      - fastjev-2070
      - --served-model-description
      - ${JEV_DESCRIPTION:-Qwen3-0.6B BF16 torch direct option-logit on the RTX 2070}
      - --served-model-release-date
      - "2026-10-16"
    ports:
      - "127.0.0.1:8730:8000"
    volumes:
      - jev-hf:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]   # RTX 2070; never count: all (ARCHITECTURE §8)
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/models')"]
      interval: 30s
      timeout: 5s
      start_period: 300s
      retries: 5
    restart: unless-stopped

volumes:
  world:
  body-1:
  jev-hf:
  knowledge:
  hive-run:
