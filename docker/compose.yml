# Last Order stack (ADR-015, ADR-050). Run from the repo root:
#   bash docker/node/up.sh        # the core up, the slots created (stopped), keys from .env
#   NODE_DEV_OPEN=1 docker compose -f docker/compose.yml up -d   # dev, no keys: gates open
#
# Tiers (ADR-050):
# - core (no profile, restart unless-stopped — the only thing Docker brings back on its
#   own): hive (the board), last-order, hapi-hub, llm-gateway + gateway-db, zai-egress,
#   egress, media, infra (the executor that starts everything else);
# - a slot = the sister node-N + her mind-N (profile `slots`): started by Last Order or
#   the operator's board button through infra `slot_up`;
# - a body (profile `bodies`): body-N, raised by its own mind through infra `body_up` —
#   the body is the mind's, and a mind may wear the body of another game (BODY_KINDS);
# - the home world (profile `world`): mc-server, raised by infra before a body that plays
#   there and stopped when no body is left.
# Every non-core container is restart "no": after a Docker daemon death `on-failure` and
# `unless-stopped` both resurrect running containers (T-034 П-4, NETWORK.md section 9),
# and slots must not come back unattended and burn quota. Crash recovery follows the
# hierarchy instead: the runner asks for its mind back, the mind asks for its body.
# The mind and its body are peers on the slot's private link-N (the uc py4j gateway binds
# localhost inside the body; the body relays it to the mind's fixed link address); the
# node sandbox reaches its mind's MCP (slot-N), hive/llm-gateway/zai-egress (svc-N) and
# api.z.ai through the passthrough proxy alone (ADR-033, T-027).
# Bind sources ride ${STAND_DAEMON_ROOT}: the repo as the Docker daemon sees it, the same
# path for the host CLI and for compose inside the infra container (up.sh computes it).
name: lastorder

# json-file with rotation on every service: a long-lived stand must not fill the disk
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# The Fabric versions in one place (T-062): the same compose variables feed the server
# env below and the body build args, so the server and the clients cannot drift apart
# (kept equal by tests/test_fabric_server.py). Loader 0.20.1 and launcher 1.1.2 are the
# stable fabricmc.net meta picks for 1.21.11 (checked 2026-11-11), fabric-api is the
# only server mod (ADR-045: no mods "for the future"). At start the image downloads the
# mods from modrinth.com — the mc-server's only new egress (docker-topology.md).
x-fabric-api: &fabric-api "${FABRIC_API:-0.140.0+1.21.11}"

x-body: &body
  build:
    context: ./body
    args:
      # the same pin the server's MODRINTH_PROJECTS uses — one value for both sides
      FABRIC_API: *fabric-api
  image: lastorder-body:dev
  # ADR-050: raised by its mind through the executor, never by the stand's start; the
  # home world is raised by the executor first (no depends_on: a body may play abroad)
  profiles: [bodies]
  restart: "no"
  init: true   # tini reaps the bridge relays and the camera's ffmpeg
  logging: *default-logging
  security_opt: ["no-new-privileges:true"]
  mem_limit: 2g
  # Ready = uc's py4j gateway is listening (T-055): the mod starts it when the
  # client reaches the title screen (unionclef AltoClef.java onInitializeLoad →
  # initializePythonSender), and a mind connecting before that breaks the bridge
  # (T-052 b). "Player in the world" is NOT observable here without a py4j call —
  # it lives in MinecraftClient alone (AltoClef.java inGame); the mind's own C1
  # ticks see the world join. bash /dev/tcp because dash has no /dev/tcp.
  healthcheck:
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/25333"]
    interval: 10s
    timeout: 3s
    retries: 18   # warm start: ~30-60 s to the title screen
    start_period: 300s   # cold start: the first boot downloads ~540 MB into /data
  environment: &body-env
    BODY_XMX: "${BODY_XMX:-768M}"   # same default as the body Dockerfile ENV (review R1-2)
    BODY_RENDER_DISTANCE: "${BODY_RENDER_DISTANCE:-2}"
    BODY_SIM_DISTANCE: "${BODY_SIM_DISTANCE:-5}"   # vanilla client minimum; lower falls back to 12
    BODY_MAX_FPS: "${BODY_MAX_FPS:-10}"
    MALLOC_ARENA_MAX: "2"   # glibc arenas: 8 per thread by default, 2 is plenty for a JVM body
    # the server's loader pin rides the same variable (T-062): entrypoint turns it into
    # HeadlessMC's fabric/<mc>/<loader> target, so the bodies' loader cannot float either
    FABRIC_LOADER: "${FABRIC_LOADER:-0.20.1}"
    # camera stream parameters (T-063, ADR-045 §9): per-slot switch BODY_CAMERA_N below;
    # defaults sized in T-065, off changes nothing until a slot turns the camera on
    BODY_CAMERA_FPS: "${BODY_CAMERA_FPS:-10}"
    BODY_CAMERA_SIZE: "${BODY_CAMERA_SIZE:-854x480}"
    BODY_CAMERA_BITRATE: "${BODY_CAMERA_BITRATE:-1M}"

# The mind of a slot (NETWORK.md section 3): C1 plus the body MCP server on :8700, a peer
# of its body on link-N (ADR-050: the body relays uc's localhost-only py4j gateway to the
# mind's fixed link address; the mind asks the executor for its body). The runner endpoints
# (/runner/status, /runner/respawn, /runner/birth) ride the same port behind the slot's
# runner key (T-027). The Jev policy is the living sister's workplace file, reached
# through the `current` symlink the runner maintains on the slot's workplaces volume
# (re-read on every threat, so a rebirth moves it by itself).
x-mind: &mind
  build:
    context: ..
    dockerfile: docker/mind/Dockerfile
  image: lastorder-mind:dev
  profiles: [slots]
  restart: "no"   # the runner asks for it back (ADR-050), nothing resurrects it unattended
  logging: *default-logging
  security_opt: ["no-new-privileges:true"]
  # ready = the MCP and runner port answers (a 401 without the runner key is an answer)
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request as u, urllib.error as e\ntry: u.urlopen('http://127.0.0.1:8700/runner/status', timeout=2)\nexcept e.HTTPError: pass"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 20s
  # SIGTERM (T-055): the mind stops uvicorn, stops C1 and closes the bridge
  # within ~11 s (TEARDOWN_GRACE_S + the close itself); the grace period is
  # above that so docker never has to SIGKILL a closing mind (a SIGKILLed
  # python partner leaves uc's gateway dead, T-052 a).
  stop_grace_period: 20s
  environment: &mind-env
    MCP_BODY_PORT: "8700"
    MCP_LOG_PATH: /mind-run/log.jsonl
    MIND_TICK_S: "${MIND_TICK_S:-0.5}"
    MIND_IDLE_S: "${MIND_IDLE_S:-120}"
    MIND_FLEE_HP: "${MIND_FLEE_HP:-6}"
    # The wait_events cap (T-054): the zcode harness kills a tool call after 30 s —
    # 7 killed waits on node-2 in the T-052 run — so the default keeps every ask
    # under it with a margin; a larger ask clamps and the answer names the value.
    WAIT_EVENTS_MAX_S: "${WAIT_EVENTS_MAX_S:-25}"
    # LLM through the gateway (T-026, ADR-033): no provider key ever enters this
    # container. No health gate on llm-gateway on purpose: a down gateway is a retry
    # case (NETWORK.md section 9), Jev timeouts fall back to the C1 rules.
    LLM_API_BASE: http://llm-gateway:4000
    JEV_BACKEND: "${JEV_BACKEND:-rules}"
    JEV_MODEL: "${JEV_MODEL:-openrouter/typesafe/jev-router}"
    JEV_TIMEOUT_S: "${JEV_TIMEOUT_S:-1.5}"
    JEV_MIN_INTERVAL_S: "${JEV_MIN_INTERVAL_S:-3}"
    JEV_POLICY_PATH: /workplaces/current/policy/threat.md
    JEV_POLICY_MAX_CHARS: "${JEV_POLICY_MAX_CHARS:-1500}"
    # fail-closed (review R2-6): without the slot's runner key the mind refuses to
    # start rather than serve /runner/* ungated; NODE_DEV_OPEN=1 is the dev exception
    NODE_DEV_OPEN: "${NODE_DEV_OPEN:-}"
    # The operator's game name (T-051): the mind marks this player's chat lines with
    # `operator: true`. A stand config value, not a secret; empty leaves the marking off.
    OPERATOR_MC_NAME: "${OPERATOR_MC_NAME:-}"
    # Player commands to the server (ADR-043, T-053): the stand's common deny list
    # (comma/space separated, case-insensitive, plugin prefixes count) rides on top
    # of the login/password default; per-slot extras arrive as MC_COMMANDS_DENY_SLOT
    # below. The login PASSWORD stays in mind-N alone (MC_LOGIN_PASSWORD below): the
    # node sandbox never sees it.
    MC_COMMANDS_DENY: "${MC_COMMANDS_DENY:-}"
    # Banned chat topics (ADR-048): the operator's list, mounted read-only into the
    # minds alone (see each mind's volumes) — never into a sandbox, where the list
    # itself would reach a prompt. Empty turns the filter off.
    CHAT_TOPICS_PATH: "${CHAT_TOPICS_PATH:-/etc/lastorder/chat-topics/topics.txt}"
  command: ["python", "-m", "runtime.mind"]

# The node sandbox of a slot (T-027, ADR-033): the runner plus both harnesses in one
# container. The runner is root (it drops every harness process to the `sister` uid and
# reads its secrets from 0400 files); the container itself is read-only with tmpfs homes
# and no privilege beyond what supervision needs. Limits per NETWORK.md section 9
# (the T-024 spike measured 537-602 MiB harness peaks; the T-032 run pinned node-1 at
# 1005/999 MiB of the old 1g cap, so it is 1.5g now, the body's 1.5x margin precedent).
x-node: &node
  build:
    context: ..
    dockerfile: docker/node/Dockerfile
    target: base   # the sisters' variant without ffmpeg (T-064: lo is the desk's alone)
  image: lastorder-node:dev
  profiles: [slots]
  restart: "no"   # quota spender: no unattended resurrect after a daemon death (T-037)
  logging: *default-logging
  mem_limit: 1.5g
  cpus: "0.5"
  read_only: true
  tmpfs:
    - /tmp:size=1g,mode=1777
    - /home/sister:size=768m,mode=700
    - /run/node:size=64m,mode=700
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  cap_add: ["SETUID", "SETGID", "CHOWN", "FOWNER", "DAC_OVERRIDE", "KILL"]
  pids_limit: 512
  environment: &node-env
    BODY_BASE: http://body-1:8700
    HIVE_URL: http://hive:8000
    WORKPLACES_DIR: /workplaces
    HARNESS: "${NODE_HARNESS:-pi}"
    HARNESS_FAILOVER: "${NODE_HARNESS_FAILOVER:-opencode}"
    QUOTA_ACTION: "${NODE_QUOTA_ACTION:-wait}"
    STUCK_S: "${NODE_STUCK_S:-600}"   # the board `stuck` alarm threshold (T-045)
    # The console hub (ADR-042, T-045): with a NAMESPACED token the pi harness rides
    # `hapi pi` — the operator sees the sister in HAPI and speaks to her mid-life.
    # The base token NEVER enters a sandbox (T-044 R1-1/R1-3): up.sh derives the
    # per-slot `<base>:node-N` form; an empty token keeps the direct-pi of T-066.
    HAPI_URL: http://hapi-hub:3006
    GATEWAY_URL: http://llm-gateway:4000
    ZCODE_MODEL: "${ZCODE_MODEL:-GLM-5.3-Flash}"  # also the Pi and Hermes model by default
    PI_CONTEXT_WINDOW: "${PI_CONTEXT_WINDOW:-96000}"  # the compaction budget (T-066)
    PI_KEEP_RECENT_TOKENS: "${PI_KEEP_RECENT_TOKENS:-20000}"
    OPENCODE_MODEL: "${OPENCODE_MODEL:-openrouter/qwen/qwen3.7-flash}"
    WILL_TIMEOUT_S: "${WILL_TIMEOUT_S:-900}"
    HIVE_PENDING_WILLS: /hive-run/pending_wills
    SISTER_UID: "1001"
    SISTER_GID: "1001"
    # Secrets reach the container as env ONLY as far as the entrypoint, which writes
    # them to the root-only tmpfs /run/node/secrets (0400) and scrubs its environment
    # before exec'ing the runner: compose file-secrets are 0777 on Docker Desktop
    # (verified on the stand: a sister could read the runner key), so files-under-
    # /run/secrets cannot hold the boundary. Per-slot values come below.
    ZAI_KEY_FILE: /run/node/secrets/zai_api_key
    # the console hub token file (T-045): the entrypoint materializes the namespaced
    # <base>:node-N value and scrubs the plain env; the file is the runner's only copy
    HAPI_TOKEN_FILE: /run/node/secrets/hapi_key
    # fail-closed (review R2-6): without both keys the runner logs runner.no_keys and
    # waits instead of birthing an open node; NODE_DEV_OPEN=1 is the dev exception
    NODE_DEV_OPEN: "${NODE_DEV_OPEN:-}"
  command: ["python", "-m", "runtime.node"]
  volumes:
    # Only the staged wills of submit_will (T-028 contract), by subpath: the whole
    # hive-run volume would also show events.jsonl and other slots' wills to the
    # sister (review R2-9). The hive creates the subpath before uvicorn starts.
    - &hive-wills-mount
      type: volume
      source: hive-run
      target: /hive-run/pending_wills
      read_only: true
      volume:
        subpath: pending_wills

services:
  mc-server:
    image: itzg/minecraft-server:java21
    profiles: [world]   # ADR-050: raised by the executor before a body plays at home
    logging: *default-logging
    environment:
      EULA: "TRUE"
      # Fabric instead of vanilla (ADR-045, T-062): loader and launcher pinned, never
      # "latest"; the world on the same volume survives the switch unchanged.
      TYPE: "FABRIC"
      VERSION: "1.21.11"
      FABRIC_LOADER_VERSION: "${FABRIC_LOADER:-0.20.1}"
      FABRIC_LAUNCHER_VERSION: "${FABRIC_LAUNCHER:-1.1.2}"
      # skinrestorer (T-061): the sisters' skins on this offline server — the only
      # actively maintained server-side Fabric skin mod with an exact 1.21.11 build
      # (Modrinth `skinrestorer`, checked 2026-11-11); pinned like fabric-api above.
      MODRINTH_PROJECTS: "fabric-api:${FABRIC_API:-0.140.0+1.21.11},skinrestorer:${SKINRESTORER:-2.11.1+1.21.11-fabric}"
      ONLINE_MODE: "FALSE"
      ENFORCE_SECURE_PROFILE: "FALSE"   # offline clients cannot sign chat
      DIFFICULTY: "easy"
      MODE: "survival"
      MEMORY: "1536M"
      VIEW_DISTANCE: "6"
      SIMULATION_DISTANCE: "5"
      SPAWN_PROTECTION: "0"
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: "${RCON_PASSWORD:-lastorder}"
      MOTD: "Last Order"
    ports:
      - "${MC_HOST_PORT:-25565}:25565"   # join from the host to watch
    volumes:
      - world:/data
      # the operator's chosen skin (T-061), mounted READ-ONLY for the mod's
      # collection provider; the sandboxes and the agent never see this file
      - ${STAND_DAEMON_ROOT:-..}/agent/last_order/skin/sister.png:/skins/sister.png:ro
      # the mod's config (T-061): autoFetch off (this offline server hands out
      # its own skin), the collection provider on with the file above, slim
      - ${STAND_DAEMON_ROOT:-..}/docker/mc-server/skinrestorer/config.json:/data/config/skinrestorer/config.json:ro
    restart: "no"   # stopped when no body is left; a crash is the minds' body_restart

  body-1:
    <<: *body
    environment:
      <<: *body-env
      MC_USERNAME: LastOrder01
      # MC_SERVER_N moves this body to another server (Last Order's slot_server, the
      # recorded move in .stand/servers.env or .env): the body rides the default network,
      # so an external address is reachable; its mind reconnects over the link.
      MC_SERVER: "${MC_SERVER_1:-mc-server:25565}"
      MIND_HOST: 10.250.1.3   # the bridge relays (ADR-050): uc's callback goes to the mind on link-1
      MIND_LINK_IP: 10.250.1.3   # and only this address may reach uc's gateway
      BODY_LINK_IP: 10.250.1.2   # the gateway relay listens on link-1 only
      # BODY_CAMERA_1=1 turns this slot's camera on (T-063): Xvfb + ffmpeg → media
      BODY_CAMERA: "${BODY_CAMERA_1:-}"
    volumes:
      - body-1:/data
    # link-1: the bridge to mind-1 alone (ADR-050); media-net only for the camera stream
    networks:
      default: {}
      link-1:
        ipv4_address: 10.250.1.2
      media-net: {}

  # The mind of slot 1: see the x-mind anchor.
  mind-1:
    <<: *mind
    # ADR-050: a peer of its body — the MCP to node-1 on slot-1, the py4j bridge to
    # body-1 on link-1 from a fixed address the body's relay admits, hive and the
    # gateway on default. The mind raises its body itself (bodyctl) and reconnects
    # whenever the body is recreated; it never boots before it (T-052 b) because the
    # bridge only connects once uc's gateway answers.
    networks:
      default: {}
      slot-1: {}
      link-1:
        ipv4_address: 10.250.1.3
    environment:
      <<: *mind-env
      MC_USERNAME: LastOrder01
      BODY_HOST: 10.250.1.2        # the body's relay on link-1 (ADR-050); a name would resolve off the link
      BODY_PORT: "25433"
      CALLBACK_ADDRESS: 10.250.1.3   # uc's callback arrives here, relayed by the body
      LLM_API_KEY: "${GATEWAY_KEY_MIND_1:-}"
      MIND_RUNNER_KEY: "${HIVE_RUNNER_KEY_1:-}"
      MC_COMMANDS_DENY_SLOT: "${MC_COMMANDS_DENY_1:-}"
      # the slot's server password (T-053): mind-N logs in itself; the value is
      # lifted by up.sh into THIS mind alone, never into node-N
      MC_LOGIN_PASSWORD: "${MC_LOGIN_PASSWORD_1:-}"
      # the slot's post-login skin command (T-061): what an external server's own
      # skin plugin expects, sent by the environment right after /login; empty —
      # the default — sends nothing (our mc-server skins come from skinrestorer)
      MC_SKIN_COMMAND: "${MC_SKIN_COMMAND_1:-}"
    volumes:
      - mind-1-run:/mind-run
      - workplaces-1:/workplaces:ro   # the Jev policy of the living sister, read-only
      - ${STAND_DAEMON_ROOT:-..}/docker/mind/chat-topics:/etc/lastorder/chat-topics:ro   # ADR-048, the operator's list (a dir: edits propagate)

  # The sandbox of slot 1 (T-027). zai-egress rides along (T-034 П-1): without the
  # passthrough the zcode harness has no route to api.z.ai and the session dies.
  node-1:
    <<: *node
    depends_on:   # hive creates the pending_wills subpath before uvicorn
      zai-egress: {condition: service_started}
      hive: {condition: service_healthy}
      mind-1: {condition: service_healthy}
    environment:
      <<: *node-env
      NODE_SLOT: LastOrder01
      BODY_BASE: http://mind-1:8700   # the body MCP lives in the mind (ADR-050)
      RUNNER_KEY_FILE: /run/node/secrets/runner_key
      HIVE_NODE_KEY_FILE: /run/node/secrets/node_mcp_key
      GATEWAY_KEY_FILE: /run/node/secrets/gateway_node_key
      HIVE_RUNNER_KEY: "${HIVE_RUNNER_KEY_1:-}"
      HIVE_NODE_KEY: "${HIVE_NODE_KEY_1:-}"
      GATEWAY_NODE_KEY: "${GATEWAY_KEY_NODE_1:-}"
      HAPI_TOKEN: "${HAPI_TOKEN_1:-}"
      ZAI_API_KEY: "${ZCODE_API_KEY:-}"
    volumes:
      - *hive-wills-mount
      - workplaces-1:/workplaces
    networks: [slot-1, svc-1]

  body-2:
    <<: *body
    environment:
      <<: *body-env
      MC_USERNAME: LastOrder02
      # MC_SERVER_N moves this body to another server (T-057, the infra bridge's
      # slot_server): same override shape as slot 1, all slots alike
      MC_SERVER: "${MC_SERVER_2:-mc-server:25565}"
      MIND_HOST: 10.250.2.3   # the bridge relays (ADR-050): uc's callback goes to the mind on link-2
      MIND_LINK_IP: 10.250.2.3
      BODY_LINK_IP: 10.250.2.2   # the gateway relay listens on link-2 only
      BODY_CAMERA: "${BODY_CAMERA_2:-}"
    volumes:
      - body-2:/data
    networks:
      default: {}
      link-2:
        ipv4_address: 10.250.2.2
      media-net: {}

  mind-2:
    <<: *mind
    networks:   # ADR-050: see mind-1
      default: {}
      slot-2: {}
      link-2:
        ipv4_address: 10.250.2.3
    environment:
      <<: *mind-env
      MC_USERNAME: LastOrder02
      BODY_HOST: 10.250.2.2        # the body's relay on link-2 (ADR-050); a name would resolve off the link
      BODY_PORT: "25433"
      CALLBACK_ADDRESS: 10.250.2.3   # uc's callback arrives here, relayed by the body
      LLM_API_KEY: "${GATEWAY_KEY_MIND_2:-}"
      MIND_RUNNER_KEY: "${HIVE_RUNNER_KEY_2:-}"
      MC_COMMANDS_DENY_SLOT: "${MC_COMMANDS_DENY_2:-}"
      # the slot's server password (T-053): mind-N logs in itself; the value is
      # lifted by up.sh into THIS mind alone, never into node-N
      MC_LOGIN_PASSWORD: "${MC_LOGIN_PASSWORD_2:-}"
      MC_SKIN_COMMAND: "${MC_SKIN_COMMAND_2:-}"   # the T-061 skin command, slot shape of mind-1
    volumes:
      - mind-2-run:/mind-run
      - workplaces-2:/workplaces:ro
      - ${STAND_DAEMON_ROOT:-..}/docker/mind/chat-topics:/etc/lastorder/chat-topics:ro   # ADR-048, the operator's list (a dir: edits propagate)

  node-2:
    <<: *node
    depends_on:
      zai-egress: {condition: service_started}
      hive: {condition: service_healthy}
      mind-2: {condition: service_healthy}
    environment:
      <<: *node-env
      NODE_SLOT: LastOrder02
      BODY_BASE: http://mind-2:8700   # the body MCP lives in the mind (ADR-050)
      RUNNER_KEY_FILE: /run/node/secrets/runner_key
      HIVE_NODE_KEY_FILE: /run/node/secrets/node_mcp_key
      GATEWAY_KEY_FILE: /run/node/secrets/gateway_node_key
      HIVE_RUNNER_KEY: "${HIVE_RUNNER_KEY_2:-}"
      HIVE_NODE_KEY: "${HIVE_NODE_KEY_2:-}"
      GATEWAY_NODE_KEY: "${GATEWAY_KEY_NODE_2:-}"
      HAPI_TOKEN: "${HAPI_TOKEN_2:-}"
      ZAI_API_KEY: "${ZCODE_API_KEY:-}"
    volumes:
      - *hive-wills-mount
      - workplaces-2:/workplaces
    networks: [slot-2, svc-2]

  body-3:
    <<: *body
    environment:
      <<: *body-env
      MC_USERNAME: LastOrder03
      MC_SERVER: "${MC_SERVER_3:-mc-server:25565}"
      MIND_HOST: 10.250.3.3   # the bridge relays (ADR-050): uc's callback goes to the mind on link-3
      MIND_LINK_IP: 10.250.3.3
      BODY_LINK_IP: 10.250.3.2   # the gateway relay listens on link-3 only
      BODY_CAMERA: "${BODY_CAMERA_3:-}"
    volumes:
      - body-3:/data
    networks:
      default: {}
      link-3:
        ipv4_address: 10.250.3.2
      media-net: {}

  mind-3:
    <<: *mind
    networks:   # ADR-050: see mind-1
      default: {}
      slot-3: {}
      link-3:
        ipv4_address: 10.250.3.3
    environment:
      <<: *mind-env
      MC_USERNAME: LastOrder03
      BODY_HOST: 10.250.3.2        # the body's relay on link-3 (ADR-050); a name would resolve off the link
      BODY_PORT: "25433"
      CALLBACK_ADDRESS: 10.250.3.3   # uc's callback arrives here, relayed by the body
      LLM_API_KEY: "${GATEWAY_KEY_MIND_3:-}"
      MIND_RUNNER_KEY: "${HIVE_RUNNER_KEY_3:-}"
      MC_COMMANDS_DENY_SLOT: "${MC_COMMANDS_DENY_3:-}"
      # the slot's server password (T-053): mind-N logs in itself; the value is
      # lifted by up.sh into THIS mind alone, never into node-N
      MC_LOGIN_PASSWORD: "${MC_LOGIN_PASSWORD_3:-}"
      MC_SKIN_COMMAND: "${MC_SKIN_COMMAND_3:-}"   # the T-061 skin command, slot shape of mind-1
    volumes:
      - mind-3-run:/mind-run
      - workplaces-3:/workplaces:ro
      - ${STAND_DAEMON_ROOT:-..}/docker/mind/chat-topics:/etc/lastorder/chat-topics:ro   # ADR-048, the operator's list (a dir: edits propagate)

  node-3:
    <<: *node
    depends_on:
      zai-egress: {condition: service_started}
      hive: {condition: service_healthy}
      mind-3: {condition: service_healthy}
    environment:
      <<: *node-env
      NODE_SLOT: LastOrder03
      BODY_BASE: http://mind-3:8700   # the body MCP lives in the mind (ADR-050)
      RUNNER_KEY_FILE: /run/node/secrets/runner_key
      HIVE_NODE_KEY_FILE: /run/node/secrets/node_mcp_key
      GATEWAY_KEY_FILE: /run/node/secrets/gateway_node_key
      HIVE_RUNNER_KEY: "${HIVE_RUNNER_KEY_3:-}"
      HIVE_NODE_KEY: "${HIVE_NODE_KEY_3:-}"
      GATEWAY_NODE_KEY: "${GATEWAY_KEY_NODE_3:-}"
      HAPI_TOKEN: "${HAPI_TOKEN_3:-}"
      ZAI_API_KEY: "${ZCODE_API_KEY:-}"
    volumes:
      - *hive-wills-mount
      - workplaces-3:/workplaces
    networks: [slot-3, svc-3]

  # The hive (NETWORK.md section 3): node registry, knowledge base under git (T-012 store),
  # the lifetime scan and RCON deaths (T-022), the network MCP (T-028). Port 8000 stays
  # inside the docker network. Exactly one uvicorn worker: lifecycle.json, the inboxes
  # and the slot sequence are in-process state under locks (T-022 review P1-4). The key
  # maps are lifted by docker/node/up.sh; an empty HIVE_RUNNER_KEYS is a startup refusal
  # (review R2-6) — NODE_DEV_OPEN=1 is the explicit dev exception. The mkdir creates the
  # pending_wills subpath the node sandboxes mount read-only (R2-9) before uvicorn runs.
  hive:
    build:
      context: ..
      dockerfile: docker/mind/Dockerfile
    image: lastorder-mind:dev
    # no depends_on mc-server (ADR-050): the world runs on demand; RCON deaths answer
    # 503 and retry while it is down
    environment:
      KNOWLEDGE_DIR: /knowledge
      RUN_DIR: /hive-run
      RCON_HOST: mc-server
      RCON_PASSWORD: "${RCON_PASSWORD:-lastorder}"
      MAX_LIFE_MIN: "${MAX_LIFE_MIN:-45}"
      LLM_API_BASE: http://llm-gateway:4000
      LLM_API_KEY: "${GATEWAY_KEY_HIVE:-}"
      HIVE_MCP_NODE_KEYS: "${HIVE_MCP_NODE_KEYS:-}"
      HIVE_RUNNER_KEYS: "${HIVE_RUNNER_KEYS:-}"
      HIVE_MCP_LO_KEY: "${HIVE_MCP_LO_KEY:-}"
      HIVE_OPERATOR_KEY: "${HIVE_OPERATOR_KEY:-}"
      HIVE_TOOL_KEY: "${HIVE_TOOL_KEY:-}"
      HIVE_EGRESS_PROXY: "${HIVE_EGRESS_PROXY:-http://egress:3128}"   # the grant relay goes out here (relay.py)
      HIVE_INFRA_KEY: "${HIVE_INFRA_KEY:-}"
      NODE_DEV_OPEN: "${NODE_DEV_OPEN:-}"
    command:
      - sh
      - -c
      - mkdir -p /hive-run/pending_wills && exec uvicorn runtime.hive.app:create_app --factory --host 0.0.0.0 --port 8000 --workers 1
    ports:
      # the operator's board API and page (T-042/T-049): loopback only, for the
      # operator's browser on the host; the docker network stays the boundary for the rest.
      # 8000 on the host is taken by a system service (checked 2026-10-26), so the
      # loopback default is 18080; HIVE_BOARD_PORT overrides the number in .env.
      - "127.0.0.1:${HIVE_BOARD_PORT:-18080}:8000"
    volumes:
      - knowledge:/knowledge
      - hive-run:/hive-run   # not over the image's system /run (review R1-6)
      - hive-work:/lo-workplace:ro   # Last Order's workshop/, read by publish_tool (T-047)
    networks: [default, svc-1, svc-2, svc-3, svc-lo, infra-net]   # infra-net: the executor alone
    restart: unless-stopped
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    healthcheck:   # the API answers (a 401/403 without a key is an answer)
      test: ["CMD", "python", "-c", "import urllib.request as u, urllib.error as e\ntry: u.urlopen('http://127.0.0.1:8000/board/infra/switch', timeout=3)\nexcept e.HTTPError: pass"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Last Order's own sandbox (T-030, ADR-036): the admin alarm plus the short harness
  # sessions of the network's administrator. The node image carries both harnesses (the
  # mind image of the hive does not); the sandbox reaches ONLY hive and llm-gateway over
  # the internal svc-lo network (plan review P1-1) plus, since T-059, api.z.ai through
  # zai-egress: the primary harness is pi on the Z.ai subscription (GLM-5.3, the
  # operator's 2026-10-31 pick) — the ADR-033 conscious exception the sisters ride too;
  # opencode through the gateway stays as the quota failover. No mc-server and its
  # RCON, no node slots, no other way out. The knowledge volume is read-only here — the
  # base is written only by the hive (ADR-017), through the MCP tools the session gets.
  # The node entrypoint renders the credentials — the gateway key into the opencode
  # auth store, the Z.ai token into the root-only tmpfs copy — and scrubs them from the
  # environment; the pi agent-dir zai-key (the session's own credential, T-066) is the
  # only other copy, and no other provider key ever enters this container.
  last-order:
    build:
      context: ..
      dockerfile: docker/node/Dockerfile
      target: lo   # + ffmpeg for cutting clips out of media (T-064); sisters build `base`
    image: lastorder-node-lo:dev
    # ADR-050: the core — the administrator is what starts the network after a reboot.
    # Her long session spends quota on events only (a death, a proposal batch, the
    # 10-minute clock); the sisters stay down until she or the operator raises them.
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      hive: {condition: service_healthy}
      llm-gateway: {condition: service_started}
    # the video desk (T-064): the harness peaks ~600 MiB and an x264 cut rides one core,
    # so the desk gets the node precedent 1.5g and a whole core
    mem_limit: 1.5g
    cpus: "1.0"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/sister:size=768m,mode=700
      - /run/node:size=64m,mode=700
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["SETUID", "SETGID", "CHOWN", "FOWNER", "DAC_OVERRIDE", "KILL"]
    pids_limit: 512
    environment:
      ADMIN_WORKPLACE: /workplace
      ADMIN_TEMPLATE_DIR: /app/agent/network
      ADMIN_KNOWLEDGE_DIR: /knowledge
      HIVE_URL: http://hive:8000
      GATEWAY_URL: http://llm-gateway:4000
      HIVE_MCP_LO_KEY: "${HIVE_MCP_LO_KEY:-}"
      ADMIN_MODEL: "${LO_MODEL:-z-ai/glm-5.3-flash}"   # the failover tier through the gateway
      ADMIN_HARNESS: "${ADMIN_HARNESS:-pi}"             # the primary: Pi on the Z.ai plan (T-059)
      ADMIN_HARNESS_FAILOVER: "${ADMIN_HARNESS_FAILOVER:-opencode}"
      ADMIN_PI_MODEL: "${ADMIN_PI_MODEL:-GLM-5.3}"      # the operator's pick: the model, not Flash
      ADMIN_PI_CONTEXT_WINDOW: "${ADMIN_PI_CONTEXT_WINDOW:-96000}"  # the compaction budget
      ADMIN_EVERY_MIN: "${ADMIN_EVERY_MIN:-10}"
      ADMIN_PROPOSALS_BATCH: "${ADMIN_PROPOSALS_BATCH:-3}"
      ADMIN_POLL_S: "${ADMIN_POLL_S:-5}"
      ADMIN_SESSION_TIMEOUT_S: "${ADMIN_SESSION_TIMEOUT_S:-600}"
      ADMIN_SESSION_MIN_GAP_S: "${ADMIN_SESSION_MIN_GAP_S:-30}"
      NAME_PRESET: "${NAME_PRESET:-lab}"
      GATEWAY_NODE_KEY: "${GATEWAY_KEY_LO:-}"   # the node entrypoint renders it into opencode auth
      ZAI_API_KEY: "${ZCODE_API_KEY:-}"         # ditto: root-only tmpfs copy + the pi zai-key
      ZAI_KEY_FILE: /run/node/secrets/zai_api_key
      # the one long session (T-043, ADR-042): the hapi CLI's hub token. A conscious
      # env exception for the DESK sandbox — the hub token opens chat sessions, not
      # providers (ADR-033); the sisters' sandboxes do not get it (T-044/T-045).
      HAPI_CLI_KEY: "${HAPI_CLI_KEY:-}"
      SISTER_UID: "1001"
      SISTER_GID: "1001"
    command: ["python", "-m", "runtime.hive.admin"]
    volumes:
      - hive-work:/workplace
      - knowledge:/knowledge:ro
      # the network's journals, read-only (T-064): the desk cuts video by the journals'
      # timestamps; a write into them must fail. The whole hive-run rides along — the
      # administrator is the one agent trusted with every slot's record.
      - hive-run:/net-logs/hive:ro
      - mind-1-run:/net-logs/mind-1:ro
      - mind-2-run:/net-logs/mind-2:ro
      - mind-3-run:/net-logs/mind-3:ro
    networks: [svc-lo, media-net]   # media-net: the footage of the camera bodies (T-063)


  # The HAPI hub (ADR-042, T-044): the operator's console. Upstream, unmodified,
  # no relay — the only ingress is the loopback-published web page and the
  # internal docker networks below. The hub holds no provider keys: agent LLM
  # traffic goes node-N -> api.z.ai directly, the hub only brokers session
  # UI/events. CLI_API_TOKEN is the stand's HAPI_CLI_KEY (stand_keys):
  # the sandboxes' `hapi` CLI authenticates with it and the operator logs into
  # the web page with the same token (POST /api/auth -> 4h JWT) [проверено:
  # T-044]. Internal networks: every node slot's svc-N plus svc-lo, so both the
  # sisters and Last Order reach it as http://hapi-hub:3006 and nothing else
  # does (ADR-033/042: the hub needs no internet and no other service).
  # hapi-web exists ONLY to carry the published port: a container on internal-
  # only networks cannot publish at all (the host has no route into an internal
  # bridge — the mapping silently goes inert [проверено: T-044]; nginx on a
  # normal bridge publishes fine). CONSCIOUS DEVIATION from "the hub needs no
  # internet" (review R1-2): the empty network gives the hub a NAT route it
  # never uses — no relay, no push, the hub initiates nothing outward; the
  # operator's ingress stays the loopback publish only. To be folded into the
  # R1-1 ADR.
  hapi-hub:
    build: ./hapi
    image: lastorder-hapi:dev
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    environment:
      CLI_API_TOKEN: "${HAPI_CLI_KEY:-}"
    ports:
      # the operator's browser on the host only; HAPI_PORT moves it if 3006
      # is taken (the hub itself always listens on 3006 inside)
      - "127.0.0.1:${HAPI_PORT:-3006}:3006"
    volumes:
      - hapi-data:/data
    networks: [hapi-web, svc-1, svc-2, svc-3, svc-lo]

  # FastJev decision server for C1 (T-005, ADR-004/023). Raises only under --profile jev.
  # GPU 0 is the RTX 2070 (5070 Ti stays free); model checkpoints live in the named volume,
  # never a bind mount. The 127.0.0.1 publish exists only for the dev/jev_spike.py measurement;
  # production callers reach the service inside the docker network as `jev:8000`.
  jev:
    build: ./jev
    image: lastorder-jev:dev
    profiles: ["jev"]
    logging: *default-logging
    environment:
      HF_HOME: /data/hf
    command:
      - --host
      - 0.0.0.0
      - --allow-unauthenticated
      - --model
      - ${JEV_MODEL:-Qwen/Qwen3-0.6B}
      - --revision
      - ${JEV_REVISION:-c1899de289a04d12100db370d81485cdf75e47ca}
      - --served-model
      - fastjev-2070
      - --served-model-description
      - ${JEV_DESCRIPTION:-Qwen3-0.6B BF16 torch direct option-logit on the RTX 2070}
      - --served-model-release-date
      - "2026-10-16"
    ports:
      - "127.0.0.1:8730:8000"
    volumes:
      - jev-hf:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]   # RTX 2070; never count: all (ARCHITECTURE §8)
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/models')"]
      interval: 30s
      timeout: 5s
      start_period: 300s
      retries: 5
    restart: on-failure

  # The LLM gateway (NETWORK.md section 3, ADR-033): LiteLLM proxy, the only holder of provider
  # keys (env, never files). Port 4000 stays inside the docker network — nothing is published
  # to the host; consumers reach it as llm-gateway:4000. Virtual keys, per-key ceilings (rpm, $/h)
  # and spend tracking live in its Postgres DB; dev/gateway_keys.py and dev/gateway_report.py
  # drive both through `docker compose exec`, so no admin port is needed either. Compose cannot
  # read the repo-root .env, and the proxy refuses to start without a master key — bring it up
  # with `bash docker/gateway/up.sh`, which lifts GATEWAY_MASTER_KEY (and the provider key)
  # from the root .env as single variables.
  llm-gateway:
    image: ghcr.io/berriai/litellm:main-stable
    depends_on:
      gateway-db:
        condition: service_healthy
    environment:
      LITELLM_MASTER_KEY: "${GATEWAY_MASTER_KEY:-}"   # issues virtual keys; set in .env
      # the password lands in the URL raw (no url-encoding in compose): letters/digits only,
      # see .env.example
      DATABASE_URL: postgresql://litellm:${GATEWAY_DB_PASSWORD:-lastorder}@gateway-db:5432/litellm
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"   # the only provider key in the stack
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks: [default, gateway-internal, svc-1, svc-2, svc-3, svc-lo]
    logging: *default-logging
    volumes:
      - ${STAND_DAEMON_ROOT:-..}/docker/gateway/config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  # Postgres of the gateway: virtual keys and spend rows. Only llm-gateway sees it (private
  # network, no published port); the default password matches the mc-server RCON precedent of
  # an internal-only secret with an .env override.
  gateway-db:
    image: postgres:15
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: "${GATEWAY_DB_PASSWORD:-lastorder}"
      POSTGRES_DB: litellm
    volumes:
      - gateway-db:/var/lib/postgresql/data
    networks: [gateway-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  # The only way out of a node sandbox (T-027 plan review P1-3): a TLS passthrough with an
  # SNI allowlist of exactly api.z.ai. In svc-N and svc-lo it carries the network alias
  # `api.z.ai`, so the pi and zcode harnesses talk to the official base URL and verify
  # the real certificate; no proxy env, no base-URL override. Everything else (internet,
  # other hosts) is refused. svc-lo since T-059: Last Order's primary harness rides the
  # same subscription route as the sisters.
  zai-egress:
    image: nginx:1.27-alpine
    logging: *default-logging
    volumes:
      - ${STAND_DAEMON_ROOT:-..}/docker/node/zai-egress.conf:/etc/nginx/nginx.conf:ro
    networks:
      egress-out: {}
      svc-1:
        aliases: ["api.z.ai"]
      svc-2:
        aliases: ["api.z.ai"]
      svc-3:
        aliases: ["api.z.ai"]
      svc-lo:
        aliases: ["api.z.ai"]
    restart: unless-stopped

  # The grants egress proxy (T-046, ADR-041, TASKBOARD.md 5.3): an HTTP CONNECT
  # tunnel that opens ONLY the domains of active egress grants. It asks hive over
  # svc-lo with HIVE_TOOL_KEY (GET /grants/egress), so an approval opens a domain
  # and a revoke closes it with no rebuild or restart. It terminates no TLS: the
  # tunnel carries the client's own certificates end-to-end, like zai-egress. It
  # sits on egress-out (the only network with a way out) and svc-lo — Last Order's
  # tool executor reaches the internet through this proxy alone; a sister sandbox
  # (svc-N) has no route to it at all.
  egress:
    build: ./egress
    image: lastorder-egress:dev
    environment:
      HIVE_URL: http://hive:8000
      HIVE_TOOL_KEY: "${HIVE_TOOL_KEY:-}"
    networks: [egress-out, svc-lo]
    restart: unless-stopped
    logging: *default-logging

  # The camera sink (T-063, ADR-045 §9): bodies with BODY_CAMERA_N=1 publish their Xvfb
  # screen over RTSP; MediaMTX records every stream into the `footage` ring buffer
  # (recordDeleteAfter via MEDIA_RETENTION, default 1d = 24h) and serves /list + /get on
  # :9996. The pinned image carries its own config at /mediamtx.yml (docker/media/);
  # rtmp/hls/webrtc/api are off. Internal only: media-net carries the bodies and (T-064)
  # last-order, node-N sandboxes have no route to it, nothing is published to the host,
  # and the box has no way out — recording is all it does.
  media:
    image: bluenviron/mediamtx:1.21.3
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    environment:
      # the ring depth (ADR-045: write always, decide later); 1d = 24h. MEDIA_SEGMENT
      # only shortens the pieces for a stand check — production keeps the 1h default.
      MTX_PATHDEFAULTS_RECORDDELETEAFTER: "${MEDIA_RETENTION:-1d}"
      MTX_PATHDEFAULTS_RECORDSEGMENTDURATION: "${MEDIA_SEGMENT:-1h}"
    volumes:
      - ${STAND_DAEMON_ROOT:-..}/docker/media/mediamtx.yml:/mediamtx.yml:ro
      - footage:/recordings
    networks: [media-net]

  # The infra executor (ADR-050; it replaces the host-side bridge of ADR-044): polls the
  # board for infra requests — Last Order's, the operator's buttons, a slot's own body
  # and mind asks — and runs the closed action set (runtime/hive/infra.py) as
  # `docker/node/up.sh` / `docker compose` argv, never a shell string, never a build.
  # Docker socket = host admin: no agent runs here, the only way in is the board with
  # the infra key, the only network is infra-net to the hive. It reads the repo (and
  # its .env, the stand's keys) read-only at the daemon's path, so the bind sources
  # compose computes resolve on the daemon side; it writes only .stand/ (the recorded
  # moves). Core: it is what raises everything else after a reboot.
  infra:
    build: ./infra
    image: lastorder-infra:dev
    restart: unless-stopped
    init: true
    depends_on:
      hive: {condition: service_healthy}
    working_dir: ${STAND_DAEMON_ROOT:-/stand}
    command: ["python3", "dev/infra_bridge.py", "--interval", "10"]
    environment:
      HIVE_URL: http://hive:8000
      HIVE_INFRA_KEY: "${HIVE_INFRA_KEY:-}"
      STAND_DAEMON_ROOT: "${STAND_DAEMON_ROOT:-/stand}"
      INFRA_HEARTBEAT: /tmp/heartbeat
      HOME: /tmp
      DOCKER_CONFIG: /tmp/.docker
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${STAND_DAEMON_ROOT:-..}
        target: ${STAND_DAEMON_ROOT:-/stand}
        read_only: true
      - type: bind
        source: ${STAND_DAEMON_ROOT:-..}/.stand
        target: ${STAND_DAEMON_ROOT:-/stand}/.stand
        bind: {create_host_path: true}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 256m
    pids_limit: 256
    healthcheck:   # the poll loop touches the heartbeat every round
      test: ["CMD-SHELL", "find /tmp/heartbeat -mmin -2 | grep -q heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging
    networks: [infra-net]

volumes:
  world:
  body-1:
  body-2:
  body-3:
  mind-1-run:
  mind-2-run:
  mind-3-run:
  knowledge:
  hive-run:
  hive-work:
  gateway-db:
  jev-hf:
  hapi-data:
  workplaces-1:
  workplaces-2:
  workplaces-3:
  footage:

networks:
  gateway-internal: {}
  # carries only the hub's loopback port publish (see hapi-hub above)
  hapi-web: {}
  # mind-N + node-N of one slot: the mind's MCP and runner endpoints, nothing else
  slot-1: {internal: true}
  slot-2: {internal: true}
  slot-3: {internal: true}
  # body-N + mind-N of one slot (ADR-050): the py4j bridge alone. Fixed subnets: the
  # body's relay admits the mind's fixed address only; node-N is never on it.
  link-1:
    internal: true
    ipam: {config: [{subnet: 10.250.1.0/29}]}
  link-2:
    internal: true
    ipam: {config: [{subnet: 10.250.2.0/29}]}
  link-3:
    internal: true
    ipam: {config: [{subnet: 10.250.3.0/29}]}
  # hive + infra (ADR-050): the executor reaches the board and nothing else
  infra-net: {internal: true}
  # hive + llm-gateway + zai-egress + node-N of one slot: the services a node may use
  svc-1: {internal: true}
  svc-2: {internal: true}
  svc-3: {internal: true}
  # last-order + hive + llm-gateway + zai-egress (T-030 review P1-1; zai-egress since
  # T-059): the administrator's bash has no route to mc-server/RCON or the node slots,
  # and api.z.ai through the SNI-allowlisted passthrough is its only way out
  svc-lo: {internal: true}
  # the only network with a route out: zai-egress alone sits on it
  egress-out: {}
  # body cameras → media (T-063, ADR-045 §9): bodies publish RTSP, media records and
  # serves clips; internal — no route out, no host ports, and node-N never joins it
  # (a sister sandbox cannot reach the footage; last-order joins in T-064)
  media-net: {internal: true}
