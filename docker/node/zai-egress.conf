# The node sandbox's only way out (T-027 plan review P1-3): a TLS passthrough that
# allows SNI api.z.ai and nothing else. No termination — the Z.ai token rides its own
# TLS to the real host, and the client verifies the real certificate. In the svc-N
# networks this container carries the network alias `api.z.ai`, so the harness reaches
# the subscription at its official base URL with no client-side override.
#
# The REAL api.z.ai is resolved through external DNS on purpose: this container's own
# alias in svc-N would resolve `api.z.ai` right back to itself (a loop).

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 128;
}

stream {
    resolver 1.1.1.1 8.8.8.8 valid=60s ipv6=off;

    map $ssl_preread_server_name $upstream {
        api.z.ai    api.z.ai:443;
        default     127.0.0.1:1;   # refuse: anything that is not api.z.ai
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_connect_timeout 5s;
        proxy_timeout 300s;
        proxy_pass $upstream;
    }
}
