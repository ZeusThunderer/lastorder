<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Доска сети · Last Order</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/board/board.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="login-form" class="login-form">
    <h2>Вход на доску</h2>
    <p class="login-note">Пароль — HIVE_OPERATOR_KEY стенда</p>
    <input type="password" id="login-password" placeholder="пароль оператора"
           autocomplete="current-password" required>
    <button type="submit">войти</button>
    <div id="login-error" class="login-error" hidden></div>
  </form>
</div>
<header class="top">
  <h1>Доска сети</h1>
  <span id="conn" class="conn" title="живое обновление">…</span>
  <label class="filter-label">адресат:
    <select id="filter"></select>
  </label>
  <form id="new-entry" class="new-entry">
    <select id="new-kind">
      <option value="task">задача</option>
      <option value="message">сообщение</option>
    </select>
    <select id="new-to"></select>
    <textarea id="new-text" maxlength="800" placeholder="текст (до 800 символов)" required></textarea>
    <button type="submit">отправить</button>
  </form>
  <button id="logout" class="logout" hidden>выйти</button>
</header>
<main class="columns">
  <section class="column" id="col-task">
    <h2>Задачи</h2>
    <div class="cards"></div>
  </section>
  <section class="column" id="col-request">
    <h2>Запросы</h2>
    <div class="cards"></div>
  </section>
  <section class="column" id="col-info">
    <h2>Тревоги и сообщения</h2>
    <div class="cards"></div>
  </section>
</main>
<div id="toast" class="toast" hidden></div>
<script src="/board/board.js" defer></script>
</body>
</html>
